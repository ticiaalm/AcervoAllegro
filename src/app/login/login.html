<div class="container py-4">
    <header class="d-flex align-items-center justify-content-between mb-3">
        <div class="logo">
            Logo
        </div>
        <div class="input-group w-50">
            <input type="text" class="form-control" placeholder="Busca">
            <button class="btn btn-outline-secondary">
                Pesquisar
            </button>
        </div>
        <div class="usuario">
            👤
        </div>
    </header>

    <nav class="border-top border-bottom py-2 mb-4 text-center">
        <strong>MENU</strong>
    </nav>

    <div class="row">
        <div class="col-md-6 border-end">
            <h3>Já tenho cadastro</h3>
            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">
                        E-mail
                    </label>
                    <input type="email" id="email" class="form-control" placeholder="Digite seu email">
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">
                        Senha
                    </label>
                    <input type="password" id="senha" class="form-control" placeholder="Digite sua senha">
                </div>

                <button type="submit" class="btn btn-primary">
                    Entrar
                </button>

                <div class="mt-3">
                    <a routerLink="/esqueci-senha" class="btn btn-primary mt-3">
                        Esqueci minha senha
                    </a>
                </div>
            </form>
        </div>

        <div class="col-md-6 text-center">
            <h3>Ainda não tenho cadastro</h3>
            <a routerLink="/cadastro" class="btn btn-primary mt-3">
                Clique Aqui
            </a>
        </div>
    </div>
</div>
