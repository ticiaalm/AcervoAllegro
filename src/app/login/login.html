<div class="container py-4">

    <div class="row">
        <div class="col-md-6 border-end">
            <h3>Já tenho cadastro</h3>
            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">
                        E-mail
                    </label>
                    <input type="email" id="email" class="form-control" placeholder="Digite seu email">
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">
                        Senha
                    </label>
                    <input type="password" id="senha" class="form-control" placeholder="Digite sua senha">
                </div>

                <div class="mt-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary mt-3">
                        Entrar
                    </button>
                    <a routerLink="/esqueci-senha" class="btn btn-primary mt-3">
                        Esqueci minha senha
                    </a>
                </div>
            </form>
        </div>

        <div class="col-md-6 d-flex flex-column justify-content-center align-items-center text-center">
            <h3>Ainda não tem cadastro?</h3>
            <a routerLink="/cadastro" class="btn btn-primary mt-3">
                Clique aqui para se cadastrar
            </a>
        </div>
    </div>
</div>
