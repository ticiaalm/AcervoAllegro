<div class="container mt-5">
    <h2>Esqueci minha senha</h2>
    <p>
        Informe seu e-mail para receber as instruções
        de recuperação da senha.
    </p>

    <form (ngSubmit)="recuperarSenha()">
        <div class="mb-3">
            <label for="email" class="form-label">
                E-mail
            </label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Digite seu e-mail"
                [(ngModel)]="email" required #emailInput="ngModel">
            <div class="text-danger mt-1" *ngIf="emailInput.invalid && emailInput.touched">
                Digite um e-mail válido.
            </div>
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="emailInput.invalid">
            Enviar
        </button>
    </form>
    <a routerLink="/login" class="d-block mt-3">
        Voltar para o login
    </a>
</div>
