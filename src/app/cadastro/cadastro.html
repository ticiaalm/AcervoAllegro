<div class="container py-4">

    <h1 class="mb-4">Cadastro</h1>
    <form (ngSubmit)="cadastrar()">
        <div class="mb-3">
            <label for="nome" class="form-label">
                Nome
            </label>
            <input type="text" id="nome" name="nome" class="form-control" [(ngModel)]="cliente.nome">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">
                Email
            </label>
            <input type="email" id="email" name="email" class="form-control" [(ngModel)]="cliente.email">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="senha" class="form-label">
                    Senha
                </label>
                <input type="password" id="senha" name="senha" class="form-control" [(ngModel)]="cliente.senha">
            </div>

            <div class="col-md-6 mb-3">
                <label for="confirmarSenha" class="form-label">
                    Confirmar senha
                </label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" class="form-control"
                    [(ngModel)]="cliente.confirmarSenha">
            </div>
        </div>

        <div class="mb-3">
            <label for="cpf" class="form-label">
                CPF
            </label>
            <input type="text" id="cpf" name="cpf" class="form-control" [(ngModel)]="cliente.cpf">
        </div>

        <div class="mb-3">
            <label for="telefone" class="form-label">
                Telefone
            </label>
            <input type="tel" id="telefone" name="telefone" class="form-control" [(ngModel)]="cliente.telefone">

        </div>
        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
</div>
